name: Windows

on:
  push:
    branches: [ crossplatform ]
  pull_request:
    branches: [ crossplatform ]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    # ffmpeg is the one dependency that does not build itself with CMake: it has a configure
    # script (cmake/FFmpeg.cmake runs it), and that needs a POSIX shell and make. MSYS2 is
    # here to supply those two programs and nothing more — the *compiler* stays MSVC, because
    # configure runs with --toolchain=msvc, so what comes out is native MSVC static libraries
    # that the Visual Studio build links directly. No mingw, no second toolchain.
    - name: Install MSYS2 (ffmpeg's configure wants bash and make)
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        install: make diffutils
        path-type: inherit

    # Point the build at it, rather than putting it on PATH. cmake/FFmpeg.cmake takes bash and
    # make from here by absolute path and puts MSYS2 on PATH for ffmpeg's own build steps only.
    # PATH is the wrong tool for this in both directions: MSYS2 at the front shadows MSVC's
    # link.exe with a coreutils program of the same name, and MSYS2 at the back loses to the
    # runner's *other* GNU make — which is native, and cannot resolve the POSIX source path
    # that ffmpeg's configure writes into its Makefile.
    - name: Tell the build where MSYS2 is
      run: echo "MSYS2_ROOT=${{ steps.msys2.outputs.msys2-location }}" >> $env:GITHUB_ENV

    # Otherwise nothing to install. SDL3 and FreeType come in through FetchContent, and the
    # shaders are compiled by the Windows SDK's own dxc.exe (HLSL -> DXIL, the one
    # format the D3D12 backend loads), which the root CMakeLists globs out of
    # Windows Kits\10\bin\<ver>\x64 — so this platform needs no SDL_shadercross and
    # therefore no DirectXShaderCompiler build.
    #
    # The generator is deliberately not named. CMake's default on Windows is the
    # newest Visual Studio installed, and the runner image is a moving target:
    # windows-latest carried VS 2022 until June 2026 and now carries VS 2026, so
    # any pinned "-G Visual Studio <n> <year>" breaks on the next image bump. The
    # image's own CMake is new enough to know whichever VS it ships with.
    #
    # Visual Studio is a multi-config generator: the build type is chosen at build
    # time with --config, and CMAKE_BUILD_TYPE at configure time would be ignored.
    - name: Game -- configure
      run: cmake -A x64 -B build

    - name: Game -- build
      run: cmake --build build --config ${{env.BUILD_TYPE}} --parallel 3

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VistaEngine-Windows
        path: |
          build/Game/${{env.BUILD_TYPE}}/Game.exe
          build/Game/${{env.BUILD_TYPE}}/Game.pdb
          build/_deps/sdl3-build/${{env.BUILD_TYPE}}/SDL3.dll

  # The SurMap5Qt editor: same engine modules, plus Qt 6 and the Qt-specific
  # sources. It needs Qt installed (aquamarine's action), and a build where
  # BUILD_EDITOR=ON makes the root CMakeLists add SurMap5Qt. The build reuses
  # the ffmpeg/MSYS2 setup the Game job needs, so this job is a trimmed copy.
  editor:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    # ffmpeg's configure needs a POSIX shell + make, exactly as in the Game job.
    - name: Install MSYS2 (ffmpeg's configure wants bash and make)
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        install: make diffutils
        path-type: inherit

    - name: Tell the build where MSYS2 is
      run: echo "MSYS2_ROOT=${{ steps.msys2.outputs.msys2-location }}" >> $env:GITHUB_ENV

    # Qt 6 (Widgets) is the one editor-only dependency. The engine itself needs
    # nothing from it — the Qt translation units link Qt, the EditorEngine
    # static library stays engine-flag-clean.
    - name: Install Qt
      id: qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.11.*'
        arch: win64_msvc2022_64
        cache: true

    - name: Editor -- configure
      run: cmake -A x64 -B build -DBUILD_EDITOR=ON -DCMAKE_PREFIX_PATH=${{ steps.qt.outputs.qtpath }}

    - name: Editor -- build
      run: cmake --build build --config ${{env.BUILD_TYPE}} --target SurMap5Qt --parallel 3

    - name: Editor -- smoke test
      # --selftest loads or creates the world, prints [selftest] LOAD OK /
      # CREATE OK / CREATE FAILED to stderr, then exits with 0/1 itself.
      run: |
        $env:Path = "${{ steps.qt.outputs.qtpath }}\bin;" + $env:Path
        Copy-Item build\_deps\sdl3-build\${{env.BUILD_TYPE}}\SDL3.dll build\SurMap5Qt\${{env.BUILD_TYPE}}\
        & build\SurMap5Qt\${{env.BUILD_TYPE}}\SurMap5Qt.exe --selftest=SmokeTest

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SurMap5Qt-Windows
        path: |
          build/SurMap5Qt/${{env.BUILD_TYPE}}/SurMap5Qt.exe
          build/SurMap5Qt/${{env.BUILD_TYPE}}/SurMap5Qt.pdb

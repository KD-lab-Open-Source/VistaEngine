name: Linux

on:
  push:
    branches: [ crossplatform, qt-editor ]
  pull_request:
    branches: [ crossplatform, qt-editor ]
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: RelWithDebInfo
  # Clang, not the distro default GCC: this is MSVC-origin code and the engine
  # leans on __super in ~180 files, which only clang's -fms-extensions accepts
  # (the flag exists in GCC but does not bring the keyword with it).
  CC: clang
  CXX: clang++

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ubuntu-latest

    # Both data schemas, in parallel. MAELSTROM_DATA=ON selects the pre-2008 layout
    # at the ~dozen sites where a field changed nesting or owner (see the option in
    # the root CMakeLists); those #ifdef branches are compiled by nothing else, so
    # without this leg they rot untested.
    #
    # fail-fast is off on purpose: the legs are independent binaries -- neither can
    # load the other's data -- and a break in one says nothing about the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Quoted: bare ON/OFF are booleans in YAML 1.1, and while GitHub's parser
          # reads them as strings, nothing downstream should depend on knowing that.
          - maelstrom: "OFF"
            label: Perimeter2
          - maelstrom: "ON"
            label: Maelstrom

    steps:
    - uses: actions/checkout@v4

    # SDL3 is built from source (FetchContent), and it treats its X11 and Wayland
    # dependencies as hard requirements: a missing one fails the configure outright
    # rather than quietly disabling the backend. So this is SDL's own documented
    # dependency list (docs/README-linux.md), narrowed to the video subsystem —
    # SDL_INIT_VIDEO is all the engine ever initializes, and the root CMakeLists
    # turns SDL's audio/joystick/camera/... off, which is what makes the audio and
    # input packages of that list unnecessary here.
    #
    # Two names that look droppable and are not: libxtst-dev is the X11 XTest
    # *extension*, nothing to do with SDL's test suite, and libwayland-bin is where
    # wayland-scanner lives.
    #
    # FreeType is vendored too, with every optional dependency disabled, so it
    # needs nothing from the system.
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ninja-build clang pkg-config \
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
          libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
          libwayland-dev libwayland-bin wayland-protocols libdecor-0-dev \
          libgl1-mesa-dev libegl1-mesa-dev libdrm-dev libgbm-dev \
          libdbus-1-dev libudev-dev

    # No shadercross cache here, unlike macOS: on Linux the root CMakeLists
    # downloads Microsoft's prebuilt DirectXShaderCompiler instead of compiling
    # it, so all that is left to build is SPIRV-Cross and the CLI — a couple of
    # minutes, not worth a cache round-trip.
    - name: Game -- configure
      run: >
        cmake -G Ninja -B build
        -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -DMAELSTROM_DATA=${{ matrix.maelstrom }}

    - name: Game -- build
      run: cmake --build build -j3

    # The executable is named Game in both legs -- MAELSTROM_DATA only adds a compile
    # definition, it does not rename the target -- so the artifact name is the only
    # thing that says which schema the binary reads.
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VistaEngine-Linux-${{ matrix.label }}
        path: build/Game/Game

  # The SurMap5Qt editor: engine modules + Qt 6 (Widgets). Same clang toolchain
  # and SDL deps as the Game job; BUILD_EDITOR=ON adds SurMap5Qt to the build.
  editor:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ninja-build clang pkg-config \
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
          libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
          libwayland-dev libwayland-bin wayland-protocols libdecor-0-dev \
          libgl1-mesa-dev libegl1-mesa-dev libdrm-dev libgbm-dev \
          libdbus-1-dev libudev-dev \
          libglu1-mesa-dev libfontconfig1-dev libxkbcommon-x11-0 \
          libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
          libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
          libxcb-cursor0 xvfb mesa-vulkan-drivers libvulkan1

    # Qt 6 (Widgets) is the editor's UI framework. The engine needs none of it.
    # Pinned to 6.8.3 LTS (see windows.yaml): the aqt mirrors carry no
    # metadata for the 6.11 line at all.
    - name: Install Qt
      id: qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'
        cache: true

    - name: Editor -- configure
      # QT_ROOT_DIR is the env var the Qt action sets (it has no qtpath output).
      run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DBUILD_EDITOR=ON -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR

    - name: Editor -- build
      run: cmake --build build --target SurMap5Qt

    # TEMP: smoke test disabled — the editor needs a GPU/display and content
    # layout the CI runner does not provide yet. Re-enable once --selftest
    # runs headless (offscreen platform + staged Scripts/Resource).
    # - name: Editor -- smoke test
    #   # --selftest loads/creates the world, prints [selftest] LOAD OK /
    #   # CREATE OK / CREATE FAILED and exits with 0/1 itself. Qt and SDL both
    #   # need a display; xvfb-run supplies a virtual one, and lavapipe (the
    #   # mesa software Vulkan driver, installed above) backs SDL GPU. The app
    #   # exits on its own, so a hard failure here is a real editor failure.
    #   run: |
    #     cp build/_deps/sdl3-build/libSDL3* build/SurMap5Qt/ 2>/dev/null || true
    #     export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib:build/SurMap5Qt:${LD_LIBRARY_PATH}"
    #     timeout 60 xvfb-run -a ./build/SurMap5Qt/SurMap5Qt --selftest=SmokeTest

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SurMap5Qt-Linux
        path: build/SurMap5Qt/SurMap5Qt
